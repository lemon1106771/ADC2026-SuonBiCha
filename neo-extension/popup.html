<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neo</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="popup.css"><script src="companion-config.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup"><header class="popup-head"><div class="brand"><span class="face" aria-hidden="true"><i></i></span>neo<span class="brand-dot">✳</span></div><span class="popup-tag">Your quiet companion</span></header><h1>Pick up where you left off.</h1><p class="intro">Capture a spot, return to it, or ask for help.</p>
<div class="launcher"><button class="primary" id="chat">Chat with Neo</button><button class="secondary" id="capture">Capture an area</button><button class="secondary" id="open-saved">Saved checkpoints <span id="checkpoint-count"></span></button><button class="secondary" id="summon">Open Neo <span>Alt + Shift + N</span></button></div>
<p id="popup-status" role="status">Capture works on normal website tabs.</p>
<details class="settings"><summary>Settings</summary><label><span>Neo on websites</span><input id="enabled" type="checkbox"></label><label><span>Follow my cursor</span><input id="followCursor" type="checkbox"></label><label><span>Offer help proactively</span><input id="proactive" type="checkbox"></label><label><span>Demo timing <small>8-second drift · 20-second pause</small></span><input id="demoMode" type="checkbox"></label><label><span>AI chat <small>Requires the local DeepSeek server and API key</small></span><input id="aiEnabled" type="checkbox"></label><small id="ai-disclosure">Messages you send and text you explicitly attach go to DeepSeek through the local server. Screenshots stay local.</small></details>
<div class="popup-actions"><button id="resume" class="text-button">Resume nudges</button><button id="shortcuts" class="text-button">Shortcut settings</button></div>
<button class="secondary" id="open-workspace">Open demo workspace ↗</button><small id="extension-id"></small>
</body></html>
